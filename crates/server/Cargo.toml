[package]
name = "tailr-server"
version = "1.0.6"
edition = "2021"

[dependencies]
# Core domain layer (config, daemon, runtime sampler, upgrade engine).
tailr-core = { path = "../core" }
tailr-protocol = { path = "../protocol" }
tailr-tail-engine = { path = "../tail-engine" }
tailr-search-engine = { path = "../search-engine" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "compression-gzip"] }
# Force flate2 to use the pure-Rust miniz_oxide backend instead of the default
# system zlib. tower-http's compression-gzip pulls flate2; flate2's default
# links libz.so.1 which would break tailr's "zero user-side install" promise
# on minimal alpine/distroless/scratch containers. miniz_oxide is statically
# compiled in — no runtime library dependency. Same rationale as using rustls
# instead of OpenSSL elsewhere.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Pure-Rust per-IP rate limiting (governor underneath). GovernorLayer
# extracts TCP peer IP from axum's ConnectInfo<SocketAddr> extension, which
# requires `into_make_service_with_connect_info::<SocketAddr>()` on the
# `axum::serve(...)` call site (see src/main.rs).
# 0.6.x is the release line for axum 0.8.
tower_governor = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
arc-swap = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
# Percent-decoding for the WebSocket `?token=` query param. Browsers cannot set
# custom headers on the WS handshake, so auth falls back to a query param that
# the frontend `encodeURIComponent`s — the backend must decode before comparing.
percent-encoding = "2"
include_dir = "0.7"
mime_guess = "2"
# OpenAPI spec generation (compile-time, proc-macro based). Only generates the
# spec JSON — no swagger-ui bundled (keeps the binary lean; users paste the spec
# URL into editor.swagger.io to render). utoipa core has no axum dependency
# (only derive macros are used here); version is independent of the axum line.
utoipa = "5"

[dev-dependencies]
tempfile = "3"
# tower::ServiceExt::oneshot for in-process router testing (no TCP listener).
tower = { version = "0.5", features = ["util"] }
# URL-encoding helper for constructing query strings in integration tests.
urlencoding = "2"
