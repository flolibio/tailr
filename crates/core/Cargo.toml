[package]
name = "tailr-core"
version = "1.1.1"
edition = "2021"

[features]
default = ["schema"]
# Enables ToSchema derives on core types (for OpenAPI spec generation).
# Optional so core can be used without the schema machinery (e.g. a future
# minimal MCP build that doesn't need API docs).
schema = ["dep:utoipa"]

[dependencies]
# Base capability layer (core depends on these, never the reverse).
tailr-protocol = { path = "../protocol" }
# Scanner (keyword search / file stats) for the query service. Base capability
# layer — core wraps it with budget clamping and the concurrency gate.
tailr-search-engine = { path = "../search-engine" }

# Config loading.
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"

# Serialization.
serde = { workspace = true }
serde_json = { workspace = true }

# Runtime metrics sampling (sysinfo calls platform libs that are always-present
# base OS libs, statically linked under musl — does not break the "zero user-side
# install" promise). default-features = false drops component/network/user/multithread.
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk"] }

# Tracing (logging is allowed in core — it's not terminal I/O like println!,
# it's structured log emission that each presentation layer's subscriber consumes).
tracing = { workspace = true }

# tokio signal handling for daemon graceful shutdown. Only the `signal` feature
# is pulled in (no full runtime here — core never spawns/owns a runtime; the
# binary starts it). `shutdown_signal()` awaits SIGINT/SIGTERM/SIGHUP within an
# already-running runtime provided by the presentation layer.
tokio = { version = "1", features = ["macros", "signal", "time", "sync"] }

# Self-upgrade (low-level APIs: ReleaseList, Download, Extract). We don't use
# ReleaseUpdate::update() because its internal `bump_is_compatible` filter
# blocks cross-major upgrades (0.x → 1.0). rustls backend (no OpenSSL).
self_update = { version = "0.42", default-features = false, features = ["archive-tar", "compression-flate2", "rustls"] }

# HTTP header types for the upgrade download. GitHub asset API URLs need
# `Accept: application/octet-stream` to return the binary (not JSON metadata);
# we construct that header via reqwest::header (reqwest is already pulled in
# by self_update, so this adds no new code to the binary).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Atomic self-replacement of the running binary. Re-exported by self_update as
# `self_update::self_replace`, but depended on directly here for clarity (we
# call it from our own download+replace logic, not from self_update's).
self-replace = "1"

# Version parsing/comparison for selecting the newest release. We use our own
# `>` comparison (via semver::Version) instead of self_update's
# `bump_is_compatible`, which blocks cross-major upgrades.
semver = "1"

# Temp dir for downloading + extracting the upgrade archive before atomic
# replace. Used at runtime (not just tests), so it's a regular dependency.
tempfile = "3"

# Daemonization (fork/PID/signal management). Pure std-level process control,
# no HTTP/async runtime dependency.
daemonize = "0.5"
dirs = "5.0"

# OpenAPI schema generation (optional, behind `schema` feature).
# External dep — does not violate core's boundary (no HTTP/axum concepts; just
# a derive macro that generates spec metadata about the type).
utoipa = { version = "5", optional = true }

[dev-dependencies]
tempfile = "3"
