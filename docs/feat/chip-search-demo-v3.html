<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>多关键词搜索框 Demo v2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg:#f4f6f9;
    --card:#ffffff;
    --border:#e3e7ee;
    --border-strong:#d3d9e3;
    --ink:#10131a;
    --muted:#8891a0;
    --muted-soft:#aab1bd;
    --accent:#3b6bf5;
    --accent-hover:#2f56d1;
    --accent-soft:#eaf0fe;
    --accent-text-on-solid:#ffffff;
    --ring:rgba(59,107,245,.14);
    --badge-bg:#eef1f6;
    --hover-bg:#f1f3f7;
    --dot-color:rgba(59,107,245,0.07);
    --shadow-sm:0 1px 2px rgba(16,19,26,.04);
    --shadow-md:0 8px 24px -8px rgba(16,19,26,.10);
    --shadow-lg:0 16px 40px -12px rgba(16,19,26,.16);
    color-scheme:light;
  }

  html[data-theme="dark"]{
    --bg:#0a0c11;
    --card:#12151c;
    --border:#232733;
    --border-strong:#2c3140;
    --ink:#edf0f5;
    --muted:#8891a0;
    --muted-soft:#5c6272;
    --accent:#5b86ff;
    --accent-hover:#7597ff;
    --accent-soft:rgba(91,134,255,.16);
    --accent-text-on-solid:#0a0c11;
    --ring:rgba(91,134,255,.22);
    --badge-bg:#1b1f29;
    --hover-bg:#1b1f29;
    --dot-color:rgba(91,134,255,0.10);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 8px 24px -8px rgba(0,0,0,.5);
    --shadow-lg:0 16px 40px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    background:
      radial-gradient(circle at 1px 1px, var(--dot-color) 1px, transparent 0) 0 0/24px 24px,
      var(--bg);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    padding:64px 20px;
    -webkit-font-smoothing:antialiased;
    transition:background-color .2s ease, color .2s ease;
  }

  .wrap{
    width:100%;
    max-width:760px;
  }

  .header-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    margin-bottom:24px;
  }

  .label{
    font-family:'Inter', sans-serif;
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0 0 6px;
  }

  .sub{
    font-size:13px;
    color:var(--muted);
    margin:0;
    letter-spacing:0;
  }

  .theme-toggle{
    all:unset;
    box-sizing:border-box;
    flex-shrink:0;
    width:36px;
    height:36px;
    border-radius:10px;
    border:1px solid var(--border-strong);
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--muted);
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .theme-toggle:hover{
    border-color:var(--accent);
    color:var(--accent);
  }
  .theme-toggle svg{
    width:17px;
    height:17px;
  }
  .theme-toggle .icon-moon{ display:none; }
  html[data-theme="dark"] .theme-toggle .icon-sun{ display:none; }
  html[data-theme="dark"] .theme-toggle .icon-moon{ display:block; }

  /* ---- search box ---- */
  .search-row{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap; /* 空间不够时（比如窄屏）整体换行，避免挤压变形 */
  }

  .search-shell{
    position:relative;
    flex:1;
    min-width:260px;
  }

  .search-box{
    background:var(--card);
    border:1.5px solid var(--border-strong);
    border-radius:14px;
    padding:0 8px 0 14px;
    height:50px;
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow:var(--shadow-sm);
    transition:box-shadow .15s ease, border-color .15s ease, background-color .2s ease;
  }

  .search-box.focused{
    border-color:var(--accent);
    box-shadow:0 0 0 4px var(--ring);
  }

  .search-box svg.icon{
    flex-shrink:0;
    color:var(--muted-soft);
    transition:color .15s ease;
  }
  .search-box.focused svg.icon{ color:var(--accent); }

  /* the single-line, non-wrapping row of chips + input */
  .chip-line{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    gap:6px;
    overflow:hidden;
    white-space:nowrap;
    height:100%;
  }

  .chip{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    gap:4px;
    max-width:160px;
    background:var(--accent-soft);
    border:1px solid transparent;
    color:var(--accent);
    font-size:12.5px;
    font-weight:500;
    padding:4px 5px 4px 10px;
    border-radius:8px;
    animation:pop .15s ease;
  }

  .chip .chip-text{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
  }

  @keyframes pop{
    from{ transform:scale(.85); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }

  .chip button{
    all:unset;
    display:flex;
    align-items:center;
    justify-content:center;
    width:15px;
    height:15px;
    border-radius:5px;
    cursor:pointer;
    color:var(--accent);
    font-size:13px;
    line-height:1;
    opacity:.65;
  }
  .chip button:hover{
    background:var(--accent);
    color:var(--accent-text-on-solid);
    opacity:1;
  }

  .more-badge{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    background:var(--badge-bg);
    color:var(--ink);
    font-size:12px;
    font-weight:600;
    padding:5px 10px;
    border-radius:8px;
    cursor:pointer;
    user-select:none;
    transition:background .12s ease, color .12s ease;
  }
  .more-badge:hover{ background:var(--accent-soft); color:var(--accent); }
  .more-badge.active{ background:var(--accent); color:var(--accent-text-on-solid); }

  .chip-line input{
    flex:1;
    min-width:60px;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Inter', sans-serif;
    font-size:14px;
    color:var(--ink);
    height:100%;
    padding:0 2px;
  }
  .chip-line input::placeholder{
    color:var(--muted-soft);
  }

  .clear-x{
    all:unset;
    flex-shrink:0;
    width:26px;
    height:26px;
    border-radius:7px;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--muted-soft);
    font-size:15px;
    margin-right:2px;
    transition:background .12s ease, color .12s ease;
  }
  .clear-x:hover{
    background:var(--hover-bg);
    color:var(--ink);
  }
  .clear-x.show{ display:flex; }

  /* ---- suggestion dropdown ---- */
  .suggest-dropdown{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    right:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow-lg);
    padding:6px;
    display:none;
    z-index:20;
    max-height:240px;
    overflow-y:auto;
    animation:slideDown .15s ease;
  }
  .suggest-dropdown.open{ display:block; }

  .suggest-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:13.5px;
    color:var(--ink);
    transition:background .1s ease, color .1s ease;
  }
  .suggest-item svg{
    flex-shrink:0;
    color:var(--muted-soft);
  }
  .suggest-item mark{
    background:none;
    color:var(--accent);
    font-weight:600;
  }
  .suggest-item.active{
    background:var(--accent-soft);
    color:var(--accent);
  }
  .suggest-item.active svg{ color:var(--accent); }
  .suggest-item.active mark{
    color:var(--accent);
  }

  .suggest-empty{
    padding:10px;
    font-size:12px;
    color:var(--muted);
  }

  .popup{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    right:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow-lg);
    padding:14px;
    display:none;
    z-index:10;
    animation:slideDown .15s ease;
  }
  .popup.open{ display:block; }

  @keyframes slideDown{
    from{ opacity:0; transform:translateY(-6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .popup-title{
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    letter-spacing:.04em;
    text-transform:uppercase;
    margin:0 0 10px;
  }

  .popup-chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .popup-chips .chip{
    max-width:240px; /* 弹窗里空间更充裕，截断阈值可以放宽一些 */
  }

  .hint{
    display:flex;
    justify-content:space-between;
    margin-top:12px;
    font-size:11.5px;
    color:var(--muted);
  }
  .hint kbd{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    background:var(--badge-bg);
    color:var(--ink);
    border:1px solid var(--border);
    border-radius:4px;
    padding:1.5px 5px;
    margin:0 2px;
  }

  .result{
    margin-top:20px;
    font-size:12.5px;
    color:var(--muted);
  }
  .result strong{
    color:var(--ink);
    font-weight:600;
  }

  /* ---- quick filter buttons (独立于搜索框内的 chip) ---- */
  .filter-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    flex-shrink:0;
  }

  .filter-chip{
    all:unset;
    box-sizing:border-box;
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:7px 13px;
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    font-weight:500;
    color:var(--muted);
    background:var(--card);
    border:1px solid var(--border-strong);
    border-radius:20px;
    cursor:pointer;
    transition:background .12s ease, color .12s ease, border-color .12s ease, transform .08s ease;
  }
  .filter-chip:hover{
    border-color:var(--accent);
    color:var(--accent);
  }
  .filter-chip:active{
    transform:scale(.96);
  }
  .filter-chip.selected{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-text-on-solid);
  }
  .filter-chip .check{
    display:none;
    width:13px;
    height:13px;
  }
  .filter-chip.selected .check{
    display:inline-flex;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header-row">
    <div>
      <p class="label">搜索</p>
      <p class="sub">输入关键词后按 Enter 添加，支持联想建议与键盘操作</p>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色主题" title="切换主题">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <line x1="12" y1="2" x2="12" y2="4.5"/>
        <line x1="12" y1="19.5" x2="12" y2="22"/>
        <line x1="4.2" y1="4.2" x2="6" y2="6"/>
        <line x1="18" y1="18" x2="19.8" y2="19.8"/>
        <line x1="2" y1="12" x2="4.5" y2="12"/>
        <line x1="19.5" y1="12" x2="22" y2="12"/>
        <line x1="4.2" y1="19.8" x2="6" y2="18"/>
        <line x1="18" y1="6" x2="19.8" y2="4.2"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.5A8.5 8.5 0 1 1 11.5 3a6.8 6.8 0 0 0 9.5 9.5z"/>
      </svg>
    </button>
  </div>

  <div class="search-row">
    <div class="search-shell">
      <div class="search-box" id="searchBox">
        <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <div class="chip-line" id="chipLine">
          <input type="text" id="searchInput" placeholder="输入关键词…">
        </div>
        <button class="clear-x" id="clearX" title="清除全部">×</button>
      </div>

      <div class="popup" id="popup">
        <p class="popup-title">被折叠的关键词</p>
        <div class="popup-chips" id="popupChips"></div>
      </div>

      <div class="suggest-dropdown" id="suggestDropdown"></div>
    </div>

    <div class="filter-row" id="filterRow">
      <button class="filter-chip" data-filter="article">
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        文章
      </button>
      <button class="filter-chip" data-filter="video">
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        视频
      </button>
      <button class="filter-chip" data-filter="image">
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        图片
      </button>
      <button class="filter-chip" data-filter="user">
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        用户
      </button>
      <button class="filter-chip" data-filter="recent">
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        最近一周
      </button>
    </div>
  </div>

  <div class="hint">
    <span><kbd>↑</kbd><kbd>↓</kbd> 选择 · <kbd>Enter</kbd> 添加 · <kbd>Backspace</kbd> 删除上一个</span>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
  const searchBox = document.getElementById('searchBox');
  const chipLine  = document.getElementById('chipLine');
  const input     = document.getElementById('searchInput');
  const clearX    = document.getElementById('clearX');
  const popup     = document.getElementById('popup');
  const popupChips= document.getElementById('popupChips');
  const resultEl  = document.getElementById('result');
  const suggestDropdown = document.getElementById('suggestDropdown');
  const themeToggle = document.getElementById('themeToggle');

  // ---- theme（跟随系统偏好，支持手动切换）----
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
  }
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
  applyTheme(prefersDark.matches ? 'dark' : 'light');
  prefersDark.addEventListener('change', (e) => applyTheme(e.matches ? 'dark' : 'light'));

  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  let keywords = [];   // full ordered list of keywords
  let hiddenCount = 0; // how many (from the front) are collapsed into "+N"

  // ---- mock suggestion source（实际项目里换成接口请求 / debounce） ----
  const SUGGESTION_POOL = [
    '产品设计','用户增长','A/B测试','留存分析','转化漏斗','数据看板',
    '用户画像','用户访谈','增长黑客','留存率','转化率','漏斗分析',
    '数据埋点','数据可视化','北极星指标','用户分层','冷启动','裂变营销',
    '归因分析','LTV','复购率','GMV','日活跃用户','月活跃用户'
  ];

  let suggestions = [];
  let activeIndex = -1;

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, m => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[m]));
  }

  function makeChip(word, onRemove){
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.title = word; // 超长时 hover 显示完整内容
    chip.innerHTML = `<span class="chip-text">${escapeHtml(word)}</span><button aria-label="remove">×</button>`;
    chip.querySelector('button').addEventListener('click', (e) => {
      e.stopPropagation();
      onRemove();
    });
    return chip;
  }

  function removeKeyword(word){
    keywords = keywords.filter(w => w !== word);
    if(keywords.length === 0){ closePopup(); }
    render();
  }

  function addKeyword(raw){
    const word = raw.trim();
    if(!word || keywords.includes(word)) { input.value=''; return; }
    keywords.push(word);
    input.value = '';
    closeSuggest();
    render();
  }

  // rebuild chip-line, then collapse from the front until it fits on one line
  function render(){
    // 1. clear chip-line except input
    Array.from(chipLine.children).forEach(el => { if(el !== input) el.remove(); });

    // 2. render ALL chips before the input
    keywords.forEach(word => {
      const chip = makeChip(word, () => removeKeyword(word));
      chipLine.insertBefore(chip, input);
    });

    hiddenCount = 0;

    // 3. collapse from the front (oldest) while it overflows
    const chipEls = () => Array.from(chipLine.querySelectorAll('.chip'));
    let existingBadge = null;

    while(chipLine.scrollWidth > chipLine.clientWidth && chipEls().length > 0){
      const firstChip = chipEls()[0];
      firstChip.remove();
      hiddenCount++;

      if(!existingBadge){
        existingBadge = document.createElement('span');
        existingBadge.className = 'more-badge';
        existingBadge.addEventListener('click', (e) => {
          e.stopPropagation();
          togglePopup();
        });
        chipLine.insertBefore(existingBadge, chipLine.firstChild);
      }
      existingBadge.textContent = `+${hiddenCount}`;
    }

    clearX.classList.toggle('show', keywords.length > 0);
    renderPopup();
    renderResult();
  }

  function renderPopup(){
    if(hiddenCount === 0){
      closePopup();
      popupChips.innerHTML = '';
      return;
    }
    const hidden = keywords.slice(0, hiddenCount);
    popupChips.innerHTML = '';
    hidden.forEach(word => {
      popupChips.appendChild(makeChip(word, () => removeKeyword(word)));
    });
    const badge = chipLine.querySelector('.more-badge');
    if(badge) badge.classList.toggle('active', popup.classList.contains('open'));
  }

  function togglePopup(){
    closeSuggest();
    popup.classList.toggle('open');
    const badge = chipLine.querySelector('.more-badge');
    if(badge) badge.classList.toggle('active', popup.classList.contains('open'));
  }
  function closePopup(){
    popup.classList.remove('open');
    const badge = chipLine.querySelector('.more-badge');
    if(badge) badge.classList.remove('active');
  }

  function renderResult(){
    const filterLabels = {
      article:'文章', video:'视频', image:'图片', user:'用户', recent:'最近一周'
    };
    const activeList = Array.from(activeFilters).map(k => filterLabels[k]);

    if(keywords.length === 0 && activeList.length === 0){
      resultEl.textContent = '';
      return;
    }

    let html = '';
    if(keywords.length){
      html += `正在搜索 <strong>${keywords.length}</strong> 个关键词：<strong>${keywords.join(' · ')}</strong>`;
    } else {
      html += '暂无关键词';
    }
    if(activeList.length){
      html += ` ｜ 已筛选：<strong>${activeList.join(' · ')}</strong>`;
    }
    resultEl.innerHTML = html;
  }

  // ---- suggestions ----
  function highlightMatch(word, query){
    const idx = word.toLowerCase().indexOf(query.toLowerCase());
    if(idx === -1) return escapeHtml(word);
    return escapeHtml(word.slice(0, idx))
      + '<mark>' + escapeHtml(word.slice(idx, idx + query.length)) + '</mark>'
      + escapeHtml(word.slice(idx + query.length));
  }

  function getSuggestions(query){
    if(!query) return [];
    return SUGGESTION_POOL
      .filter(w => !keywords.includes(w) && w.toLowerCase().includes(query.toLowerCase()))
      .slice(0, 6);
  }

  function renderSuggestions(){
    const query = input.value.trim();
    suggestions = getSuggestions(query);
    activeIndex = suggestions.length ? 0 : -1;

    if(!query || suggestions.length === 0){
      closeSuggest();
      return;
    }

    suggestDropdown.innerHTML = '';
    suggestions.forEach((word, i) => {
      const item = document.createElement('div');
      item.className = 'suggest-item' + (i === activeIndex ? ' active' : '');
      item.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span>${highlightMatch(word, query)}</span>`;
      item.addEventListener('mouseenter', () => setActive(i));
      item.addEventListener('mousedown', (e) => {
        e.preventDefault(); // 防止 mousedown 触发 input blur
        selectSuggestion(word);
      });
      suggestDropdown.appendChild(item);
    });

    closePopup(); // 建议下拉和折叠面板互斥，避免同屏两个下拉打架
    suggestDropdown.classList.add('open');
  }

  function setActive(i){
    activeIndex = i;
    Array.from(suggestDropdown.children).forEach((el, idx) => {
      el.classList.toggle('active', idx === i);
    });
    const activeEl = suggestDropdown.children[i];
    if(activeEl) activeEl.scrollIntoView({ block:'nearest' });
  }

  function selectSuggestion(word){
    addKeyword(word);
    closeSuggest();
    input.focus();
  }

  function closeSuggest(){
    suggestDropdown.classList.remove('open');
    suggestions = [];
    activeIndex = -1;
  }

  // ---- events ----
  input.addEventListener('input', renderSuggestions);

  input.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowDown'){
      if(suggestions.length){
        e.preventDefault();
        setActive((activeIndex + 1) % suggestions.length);
      }
      return;
    }
    if(e.key === 'ArrowUp'){
      if(suggestions.length){
        e.preventDefault();
        setActive((activeIndex - 1 + suggestions.length) % suggestions.length);
      }
      return;
    }
    if(e.key === 'Escape'){
      if(suggestDropdown.classList.contains('open')){
        e.preventDefault();
        closeSuggest();
      }
      return;
    }
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      // 下拉打开且有高亮项：优先采纳建议；否则直接把输入内容转成 chip
      if(suggestDropdown.classList.contains('open') && activeIndex >= 0 && suggestions[activeIndex]){
        selectSuggestion(suggestions[activeIndex]);
      } else {
        addKeyword(input.value);
        closeSuggest();
      }
    } else if(e.key === 'Backspace' && input.value === '' && keywords.length){
      keywords.pop();
      render();
    }
  });

  input.addEventListener('paste', (e) => {
    const text = e.clipboardData.getData('text');
    if(/[,\s]/.test(text)){
      e.preventDefault();
      text.split(/[,\s]+/).forEach(addKeyword);
    }
  });

  input.addEventListener('focus', () => {
    searchBox.classList.add('focused');
    if(input.value.trim()) renderSuggestions();
  });
  input.addEventListener('blur',  () => {
    searchBox.classList.remove('focused');
    closeSuggest();
  });

  chipLine.addEventListener('click', (e) => {
    if(e.target === chipLine) input.focus();
  });

  clearX.addEventListener('click', () => {
    keywords = [];
    render();
    input.focus();
  });

  document.addEventListener('click', (e) => {
    if(!e.target.closest('.search-shell')){
      closePopup();
      closeSuggest();
    }
  });

  window.addEventListener('resize', render);

  // ---- quick filters（独立状态，不进入搜索框的 chip / keywords 数组）----
  const filterRow = document.getElementById('filterRow');
  const activeFilters = new Set();

  filterRow.addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-chip');
    if(!btn) return;
    const key = btn.dataset.filter;
    if(activeFilters.has(key)){
      activeFilters.delete(key);
      btn.classList.remove('selected');
    } else {
      activeFilters.add(key);
      btn.classList.add('selected');
    }
    renderResult();
  });

  // seed with a few demo keywords so overflow is visible immediately
  ['产品设计','用户增长这是一个非常非常长的关键词用来测试截断效果','A/B测试','留存分析','转化漏斗','数据看板'].forEach(w => keywords.push(w));
  render();
</script>

</body>
</html>
