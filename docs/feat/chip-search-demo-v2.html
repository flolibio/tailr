<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>多关键词搜索框 Demo v2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#1c1b19;
    --paper:#f6f3ec;
    --line:#d8d2c4;
    --accent:#c65d3b;
    --accent-soft:#f0dcd2;
    --muted:#8a8478;
    --card:#fffdf8;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(28,27,25,0.06) 1px, transparent 0);
    background-size: 22px 22px;
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink);
    padding:60px 20px;
  }

  .wrap{
    width:100%;
    max-width:600px;
  }

  .label{
    font-family:'Fraunces', serif;
    font-size:32px;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0 0 6px;
  }

  .sub{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 26px;
    letter-spacing:.02em;
  }

  /* ---- search box ---- */
  .search-shell{
    position:relative;
  }

  .search-box{
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:14px;
    padding:0 8px 0 14px;
    height:50px;
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow:5px 5px 0 var(--ink);
    transition:box-shadow .15s ease, transform .15s ease;
  }

  .search-box.focused{
    box-shadow:2px 2px 0 var(--ink);
    transform:translate(3px,3px);
  }

  .search-box svg.icon{
    flex-shrink:0;
    color:var(--muted);
  }

  /* the single-line, non-wrapping row of chips + input */
  .chip-line{
    flex:1;
    min-width:0;
    display:flex;
    align-items:center;
    gap:6px;
    overflow:hidden;
    white-space:nowrap;
    height:100%;
  }

  .chip{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    gap:5px;
    max-width:160px;
    background:var(--accent-soft);
    border:1px solid var(--accent);
    color:var(--accent);
    font-size:12.5px;
    font-weight:500;
    padding:4px 5px 4px 10px;
    border-radius:20px;
    animation:pop .15s ease;
  }

  .chip .chip-text{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
  }

  @keyframes pop{
    from{ transform:scale(.7); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }

  .chip button{
    all:unset;
    display:flex;
    align-items:center;
    justify-content:center;
    width:15px;
    height:15px;
    border-radius:50%;
    cursor:pointer;
    color:var(--accent);
    font-size:12px;
    line-height:1;
  }
  .chip button:hover{
    background:var(--accent);
    color:#fff;
  }

  .more-badge{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    background:var(--ink);
    color:var(--card);
    font-size:12px;
    font-weight:500;
    padding:5px 10px;
    border-radius:20px;
    cursor:pointer;
    user-select:none;
    transition:transform .1s ease;
  }
  .more-badge:hover{ transform:scale(1.05); }
  .more-badge.active{ background:var(--accent); }

  .chip-line input{
    flex:1;
    min-width:60px;
    border:none;
    outline:none;
    background:transparent;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    color:var(--ink);
    height:100%;
    padding:0 2px;
  }
  .chip-line input::placeholder{
    color:var(--muted);
  }

  .clear-x{
    all:unset;
    flex-shrink:0;
    width:26px;
    height:26px;
    border-radius:50%;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--muted);
    font-size:15px;
    margin-right:2px;
  }
  .clear-x:hover{
    background:var(--line);
    color:var(--ink);
  }
  .clear-x.show{ display:flex; }

  /* ---- suggestion dropdown ---- */
  .suggest-dropdown{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    right:0;
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:12px;
    box-shadow:5px 5px 0 var(--ink);
    padding:6px;
    display:none;
    z-index:20;
    max-height:240px;
    overflow-y:auto;
    animation:slideDown .15s ease;
  }
  .suggest-dropdown.open{ display:block; }

  .suggest-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:13.5px;
    color:var(--ink);
  }
  .suggest-item svg{
    flex-shrink:0;
    color:var(--muted);
  }
  .suggest-item mark{
    background:var(--accent-soft);
    color:var(--accent);
    border-radius:3px;
    padding:0 1px;
  }
  .suggest-item.active{
    background:var(--accent);
    color:#fff;
  }
  .suggest-item.active svg{ color:#fff; }
  .suggest-item.active mark{
    background:rgba(255,255,255,.25);
    color:#fff;
  }

  .suggest-empty{
    padding:10px;
    font-size:12px;
    color:var(--muted);
  }

  .popup{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    right:0;
    background:var(--card);
    border:1.5px solid var(--ink);
    border-radius:12px;
    box-shadow:5px 5px 0 var(--ink);
    padding:14px;
    display:none;
    z-index:10;
    animation:slideDown .15s ease;
  }
  .popup.open{ display:block; }

  @keyframes slideDown{
    from{ opacity:0; transform:translateY(-6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .popup-title{
    font-size:11px;
    color:var(--muted);
    letter-spacing:.04em;
    margin:0 0 10px;
  }

  .popup-chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .popup-chips .chip{
    max-width:240px; /* 弹窗里空间更充裕，截断阈值可以放宽一些 */
  }

  .hint{
    display:flex;
    justify-content:space-between;
    margin-top:12px;
    font-size:11px;
    color:var(--muted);
    letter-spacing:.03em;
  }
  .hint kbd{
    font-family:inherit;
    background:#eae5d8;
    border:1px solid var(--line);
    border-radius:4px;
    padding:1px 5px;
    margin:0 2px;
  }

  .result{
    margin-top:20px;
    font-size:12.5px;
    color:var(--muted);
  }
  .result strong{
    color:var(--ink);
    font-weight:500;
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="label">搜索</p>
  <p class="sub">Enter / 空格 添加关键词 · 超出一行会折叠为 +N，点击展开</p>

  <div class="search-shell">
    <div class="search-box" id="searchBox">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <div class="chip-line" id="chipLine">
        <input type="text" id="searchInput" placeholder="输入关键词…">
      </div>
      <button class="clear-x" id="clearX" title="清除全部">×</button>
    </div>

    <div class="popup" id="popup">
      <p class="popup-title">被折叠的关键词</p>
      <div class="popup-chips" id="popupChips"></div>
    </div>

    <div class="suggest-dropdown" id="suggestDropdown"></div>
  </div>

  <div class="hint">
    <span><kbd>↑</kbd><kbd>↓</kbd> 选择 · <kbd>Enter</kbd> 添加 · <kbd>Backspace</kbd> 删除上一个</span>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
  const searchBox = document.getElementById('searchBox');
  const chipLine  = document.getElementById('chipLine');
  const input     = document.getElementById('searchInput');
  const clearX    = document.getElementById('clearX');
  const popup     = document.getElementById('popup');
  const popupChips= document.getElementById('popupChips');
  const resultEl  = document.getElementById('result');
  const suggestDropdown = document.getElementById('suggestDropdown');

  let keywords = [];   // full ordered list of keywords
  let hiddenCount = 0; // how many (from the front) are collapsed into "+N"

  // ---- mock suggestion source（实际项目里换成接口请求 / debounce） ----
  const SUGGESTION_POOL = [
    '产品设计','用户增长','A/B测试','留存分析','转化漏斗','数据看板',
    '用户画像','用户访谈','增长黑客','留存率','转化率','漏斗分析',
    '数据埋点','数据可视化','北极星指标','用户分层','冷启动','裂变营销',
    '归因分析','LTV','复购率','GMV','日活跃用户','月活跃用户'
  ];

  let suggestions = [];
  let activeIndex = -1;

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, m => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[m]));
  }

  function makeChip(word, onRemove){
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.title = word; // 超长时 hover 显示完整内容
    chip.innerHTML = `<span class="chip-text">${escapeHtml(word)}</span><button aria-label="remove">×</button>`;
    chip.querySelector('button').addEventListener('click', (e) => {
      e.stopPropagation();
      onRemove();
    });
    return chip;
  }

  function removeKeyword(word){
    keywords = keywords.filter(w => w !== word);
    if(keywords.length === 0){ closePopup(); }
    render();
  }

  function addKeyword(raw){
    const word = raw.trim();
    if(!word || keywords.includes(word)) { input.value=''; return; }
    keywords.push(word);
    input.value = '';
    closeSuggest();
    render();
  }

  // rebuild chip-line, then collapse from the front until it fits on one line
  function render(){
    // 1. clear chip-line except input
    Array.from(chipLine.children).forEach(el => { if(el !== input) el.remove(); });

    // 2. render ALL chips before the input
    keywords.forEach(word => {
      const chip = makeChip(word, () => removeKeyword(word));
      chipLine.insertBefore(chip, input);
    });

    hiddenCount = 0;

    // 3. collapse from the front (oldest) while it overflows
    const chipEls = () => Array.from(chipLine.querySelectorAll('.chip'));
    let existingBadge = null;

    while(chipLine.scrollWidth > chipLine.clientWidth && chipEls().length > 0){
      const firstChip = chipEls()[0];
      firstChip.remove();
      hiddenCount++;

      if(!existingBadge){
        existingBadge = document.createElement('span');
        existingBadge.className = 'more-badge';
        existingBadge.addEventListener('click', (e) => {
          e.stopPropagation();
          togglePopup();
        });
        chipLine.insertBefore(existingBadge, chipLine.firstChild);
      }
      existingBadge.textContent = `+${hiddenCount}`;
    }

    clearX.classList.toggle('show', keywords.length > 0);
    renderPopup();
    renderResult();
  }

  function renderPopup(){
    if(hiddenCount === 0){
      closePopup();
      popupChips.innerHTML = '';
      return;
    }
    const hidden = keywords.slice(0, hiddenCount);
    popupChips.innerHTML = '';
    hidden.forEach(word => {
      popupChips.appendChild(makeChip(word, () => removeKeyword(word)));
    });
    const badge = chipLine.querySelector('.more-badge');
    if(badge) badge.classList.toggle('active', popup.classList.contains('open'));
  }

  function togglePopup(){
    closeSuggest();
    popup.classList.toggle('open');
    const badge = chipLine.querySelector('.more-badge');
    if(badge) badge.classList.toggle('active', popup.classList.contains('open'));
  }
  function closePopup(){
    popup.classList.remove('open');
    const badge = chipLine.querySelector('.more-badge');
    if(badge) badge.classList.remove('active');
  }

  function renderResult(){
    if(keywords.length === 0){ resultEl.textContent = ''; return; }
    resultEl.innerHTML = `正在搜索 <strong>${keywords.length}</strong> 个关键词：<strong>${keywords.join(' · ')}</strong>`;
  }

  // ---- suggestions ----
  function highlightMatch(word, query){
    const idx = word.toLowerCase().indexOf(query.toLowerCase());
    if(idx === -1) return escapeHtml(word);
    return escapeHtml(word.slice(0, idx))
      + '<mark>' + escapeHtml(word.slice(idx, idx + query.length)) + '</mark>'
      + escapeHtml(word.slice(idx + query.length));
  }

  function getSuggestions(query){
    if(!query) return [];
    return SUGGESTION_POOL
      .filter(w => !keywords.includes(w) && w.toLowerCase().includes(query.toLowerCase()))
      .slice(0, 6);
  }

  function renderSuggestions(){
    const query = input.value.trim();
    suggestions = getSuggestions(query);
    activeIndex = suggestions.length ? 0 : -1;

    if(!query || suggestions.length === 0){
      closeSuggest();
      return;
    }

    suggestDropdown.innerHTML = '';
    suggestions.forEach((word, i) => {
      const item = document.createElement('div');
      item.className = 'suggest-item' + (i === activeIndex ? ' active' : '');
      item.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span>${highlightMatch(word, query)}</span>`;
      item.addEventListener('mouseenter', () => setActive(i));
      item.addEventListener('mousedown', (e) => {
        e.preventDefault(); // 防止 mousedown 触发 input blur
        selectSuggestion(word);
      });
      suggestDropdown.appendChild(item);
    });

    closePopup(); // 建议下拉和折叠面板互斥，避免同屏两个下拉打架
    suggestDropdown.classList.add('open');
  }

  function setActive(i){
    activeIndex = i;
    Array.from(suggestDropdown.children).forEach((el, idx) => {
      el.classList.toggle('active', idx === i);
    });
    const activeEl = suggestDropdown.children[i];
    if(activeEl) activeEl.scrollIntoView({ block:'nearest' });
  }

  function selectSuggestion(word){
    addKeyword(word);
    closeSuggest();
    input.focus();
  }

  function closeSuggest(){
    suggestDropdown.classList.remove('open');
    suggestions = [];
    activeIndex = -1;
  }

  // ---- events ----
  input.addEventListener('input', renderSuggestions);

  input.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowDown'){
      if(suggestions.length){
        e.preventDefault();
        setActive((activeIndex + 1) % suggestions.length);
      }
      return;
    }
    if(e.key === 'ArrowUp'){
      if(suggestions.length){
        e.preventDefault();
        setActive((activeIndex - 1 + suggestions.length) % suggestions.length);
      }
      return;
    }
    if(e.key === 'Escape'){
      if(suggestDropdown.classList.contains('open')){
        e.preventDefault();
        closeSuggest();
      }
      return;
    }
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      // 下拉打开且有高亮项：优先采纳建议；否则直接把输入内容转成 chip
      if(suggestDropdown.classList.contains('open') && activeIndex >= 0 && suggestions[activeIndex]){
        selectSuggestion(suggestions[activeIndex]);
      } else {
        addKeyword(input.value);
        closeSuggest();
      }
    } else if(e.key === 'Backspace' && input.value === '' && keywords.length){
      keywords.pop();
      render();
    }
  });

  input.addEventListener('paste', (e) => {
    const text = e.clipboardData.getData('text');
    if(/[,\s]/.test(text)){
      e.preventDefault();
      text.split(/[,\s]+/).forEach(addKeyword);
    }
  });

  input.addEventListener('focus', () => {
    searchBox.classList.add('focused');
    if(input.value.trim()) renderSuggestions();
  });
  input.addEventListener('blur',  () => {
    searchBox.classList.remove('focused');
    closeSuggest();
  });

  chipLine.addEventListener('click', (e) => {
    if(e.target === chipLine) input.focus();
  });

  clearX.addEventListener('click', () => {
    keywords = [];
    render();
    input.focus();
  });

  document.addEventListener('click', (e) => {
    if(!e.target.closest('.search-shell')){
      closePopup();
      closeSuggest();
    }
  });

  window.addEventListener('resize', render);

  // seed with a few demo keywords so overflow is visible immediately
  ['产品设计','用户增长这是一个非常非常长的关键词用来测试截断效果','A/B测试','留存分析','转化漏斗','数据看板'].forEach(w => keywords.push(w));
  render();
</script>

</body>
</html>
