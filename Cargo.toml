[package]
name = "tailr"
version = "1.0.2"
edition = "2021"

[[bin]]
name = "tailr"
path = "src/main.rs"

[dependencies]
tailr-core = { path = "crates/core" }
tailr-server = { path = "crates/server" }
tailr-protocol = { path = "crates/protocol" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/tail-engine",
    "crates/search-engine",
    "crates/core",
    "crates/server",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
notify = "6"
memmap2 = "0.9"
