name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ── Frontend ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # ── Rust cross-compile ──
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      # ── Package ──
      - name: Set archive name
        id: archive
        run: echo "name=$(echo '${{ matrix.target }}' | sed 's/-unknown//g')" >> "$GITHUB_OUTPUT"

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../tailr-${{ steps.archive.outputs.name }}.tar.gz tailr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailr-${{ steps.archive.outputs.name }}
          path: tailr-${{ steps.archive.outputs.name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      # Extract this release's section from CHANGELOG.md: everything between
      # `## [<tag>]` and the next `## [` header. Falls back to "Full Changelog"
      # auto-notes if the section is missing (e.g. malformed CHANGELOG).
      - name: Extract changelog notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # v1.0.6 → 1.0.6
          # Match either `## [v1.0.6]` or `## [1.0.6]` (tag has no v, just in case).
          NOTES=$(awk -v tag="v${VERSION}" '
            $0 ~ "^## \\[" tag "\\]" { found=1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES=$(awk -v tag="${VERSION}" '
              $0 ~ "^## \\[" tag "\\]" { found=1; next }
              /^## \[/ && found { exit }
              found { print }
            ' CHANGELOG.md)
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            tailr-x86_64-linux-musl/tailr-x86_64-linux-musl.tar.gz
            tailr-aarch64-linux-musl/tailr-aarch64-linux-musl.tar.gz
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: false
